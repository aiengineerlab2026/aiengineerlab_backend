[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rag-lab-backend"
version = "0.1.0"
description = "AI RAG Lab backend: The Restaurant and My Resume"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "langchain>=0.3.25,<0.4",
  "langchain-core>=0.3.65,<0.4",
  "langchain-text-splitters>=0.3,<0.4",
  "langchain-experimental>=0.3.4,<0.4",
  "langchain-community>=0.3.25,<0.4",
  "langchain-openai>=0.3,<0.4",
  "langchain-google-genai>=2.1,<3",
  "ragas>=0.4.3,<0.5",
  "rapidfuzz>=3.0",  # string similarity behind RAGAS's non-LLM context metrics
  "ranx>=0.3.20",  # My Resume lab: Precision@K, Recall@K, NDCG@K and MRR of a ranking
  "sentence-transformers>=3.0",
  "tiktoken>=0.7",
  "tenacity>=8.5",
  "numpy>=1.26",
  "spacy>=3.8,<4",  # My Resume lab: BM25 text preprocessing (tokenisation, stop words, lemmas)
  "rank-bm25>=0.2.2",
  "pypdf>=5.0",  # My Resume lab: text from uploaded PDF resumes
  "python-docx>=1.1",  # ... and DOCX resumes
  "python-multipart>=0.0.9",  # file uploads
  "nh3>=0.2.18",  # articles: sanitise the HTML from the rich text editor
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: opt-in tests that need a real database and/or real model calls (RUN_INTEGRATION=1)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in prompts/SQL are intentional; the formatter is not enforced
